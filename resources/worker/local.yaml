server:
  host: 0.0.0.0
  port: 8002
  gin:
    mode: debug

datasource:
  pool:
    max_open_conns: 10
    max_idle_conns: 10
    conn_max_lifetime: 30m
    conn_max_idle_time: 1m
  gorm:
    log_level: info
  postgres:
    host: 127.0.0.1
    port: 5432
    username: postgres
    password: 123456
    database: yotta
    search_path: schedule
    time_zone: UTC
    ssl_mode: disable

redis:
  mode: standalone # cluster
  network: tcp
  host: 127.0.0.1
  port: 6379
  password: 123456
  db: 0
  tls_enabled: false

logger:
  elasticsearch:
    enabled: false
    host: http://localhost:9200
    username: elastic
    password: 123456
  console_color_enabled: true
  appenders:
    - level: debug
      type: file

grpc_server:
  host: 0.0.0.0
  port: 50052

services:
  - name: yotta-saas
    endpoint: "https://api.dev.yottalabs.ai"
    headers:
      "apiKey": "N.A."

agent_node:
  busyThreshold: "0.9"
  heartbeatTimeout: "10m"

rabbitmq:
  amqp:
    uri: amqp://rabbitmq:rabbitmq@127.0.0.1:5672/testhost
    pool:
      maxConnections: 5
      maxChannelsPerConn: 10
      waitTimeoutSeconds: 30s
      reconnectIntervalSeconds: 3s
  producer:
    name: "producer0"
    retries: 0
    retryIntervalSeconds: 2s
    exchanges:
      - name: "orders"
        type: "topic"
        durable: true

      - name: "payments"
        type: "direct"
        durable: true
        
  consumers:
    - name: "order_consumer"
      queue: "order_queue"
      exchange: "orders"
      routingKey: "order.*"
      exchangeType: "topic"
      durable: true
      autoAck: false
      prefetchCount: 20

    - name: "payment_consumer"
      queue: "payment_queue"
      exchange: "payments"
      routingKey: "payment.processed"
      exchangeType: "direct"
      durable: true
      autoAck: true
      prefetchCount: 30